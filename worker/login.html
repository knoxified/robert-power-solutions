<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(700px 420px at 80% 0,#ffa81e30,transparent 62%),radial-gradient(600px 400px at 0 110%,#e5171f26,transparent 60%),#14110E;color:#fff}
.card{width:100%;max-width:380px;padding:34px 28px;border-radius:20px;background:#201B17;border:1px solid #ffffff1f;box-shadow:0 30px 80px #0008}
img{width:64px;height:64px;border-radius:16px;background:#fff;object-fit:contain;display:block;margin-bottom:22px}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}p{margin:0 0 22px;color:#b9ad9f;font-size:14px}
input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #ffffff2e;background:#14110E;color:#fff;font-size:16px;outline:none}input:focus{border-color:#FFB547}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#E5171F;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
.err{min-height:20px;margin-top:12px;color:#FF9D8F;font-size:13px}
</style></head><body>
<form class="card" id="f"><img src="/images/mark.webp" alt=""><h1>Robert's Studio</h1><p>Enter your password to continue.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
<button id="go" type="submit">Log in</button><div class="err" id="err" role="alert"></div></form>
<script>
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;er.textContent="";
fetch("__ADMIN__/api/login",{method:"POST",headers:{"content-type":"application/json","x-rps":"1"},body:JSON.stringify({password:document.getElementById("pw").value})})
.then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"Could not log in");location.reload()})})
.catch(function(x){er.textContent=x.message;b.disabled=false})});
</script></body></html>
